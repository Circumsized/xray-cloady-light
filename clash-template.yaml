port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost"
  respect-rules: true
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
  nameserver:
    - https://cloudflare-dns.com/dns-query
proxies:
  - name: "🇺🇸 美国-西雅图-机房"
    type: vless
    server: __DOMAIN__
    port: 443
    uuid: __UUID__
    tls: true
    servername: __DOMAIN__
    network: ws
    ws-opts:
      path: "__WS_PATH__"
proxy-groups:
  - name: "🚀 节点选择"
    type: select
    proxies:
      - "♻️ 自动选择"
      - "🇺🇸 美国-西雅图-机房"
      - "DIRECT"
  - name: "♻️ 自动选择"
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    proxies:
      - "🇺🇸 美国-西雅图-机房"
  - name: "🤖 AI"
    type: select
    proxies:
      - "🇺🇸 美国-西雅图-机房"
      - "🚀 节点选择"
      - "DIRECT"
  - name: "💎 Gemini"
    type: select
    proxies:
      - "🇺🇸 美国-西雅图-机房"
      - "🤖 AI"
  - name: "🐙 GitHub"
    type: select
    proxies:
      - "🇺🇸 美国-西雅图-机房"
      - "♻️ 自动选择"
      - "DIRECT"
  - name: "🎬 流媒体"
    type: select
    proxies:
      - "♻️ 自动选择"
      - "🇺🇸 美国-西雅图-机房"
      - "DIRECT"
rule-providers:
  reject:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/BanAD.list"
    path: ./ruleset/reject.yaml
    interval: 86400
  proxy:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt"
    path: ./ruleset/proxy.yaml
    interval: 86400
  gfw:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/gfw.txt"
    path: ./ruleset/gfw.yaml
    interval: 86400
  tld-not-cn:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/tld-not-cn.txt"
    path: ./ruleset/tld-not-cn.yaml
    interval: 86400
  direct:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt"
    path: ./ruleset/direct.yaml
    interval: 86400
  chinadomain:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/ChinaDomain.list"
    path: ./ruleset/chinadomain.yaml
    interval: 86400
  chinaip:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/ChinaIp.list"
    path: ./ruleset/chinaip.yaml
    interval: 86400
  chinacompanyip:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/ChinaCompanyIp.list"
    path: ./ruleset/chinacompanyip.yaml
    interval: 86400
  cncidr:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt"
    path: ./ruleset/cncidr.yaml
    interval: 86400
  lancidr:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt"
    path: ./ruleset/lancidr.yaml
    interval: 86400
  media:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/ProxyMedia.list"
    path: ./ruleset/media.yaml
    interval: 86400
  openai:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/openai.mrs"
    path: ./ruleset/openai.mrs
    interval: 86400
  anthropic:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/anthropic.mrs"
    path: ./ruleset/anthropic.mrs
    interval: 86400
  gemini:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/google-gemini.mrs"
    path: ./ruleset/gemini.mrs
    interval: 86400
  github:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/github.mrs"
    path: ./ruleset/github.mrs
    interval: 86400
rules:
  # DoH 上游：按 DNS 配置分流（Cloudflare 走代理、阿里走直连）
  - DOMAIN,cloudflare-dns.com,🚀 节点选择
  - DOMAIN,dns.alidns.com,DIRECT
  # 例外（缺口补丁）：国内站直连，置顶
  # deepseek / kimi：不在 ChinaDomain.list，国内可直接访问，走直连省节点流量
  - DOMAIN-SUFFIX,deepseek.com,DIRECT
  - DOMAIN-SUFFIX,kimi.com,DIRECT
  # gitcode / gitee：不在 ChinaDomain.list 也不在代理表，曾落到 MATCH 走美国节点
  # 导致 ERR_EMPTY_RESPONSE；国内可直接访问，走直连
  - DOMAIN-SUFFIX,gitcode.com,DIRECT
  - DOMAIN-SUFFIX,gitee.com,DIRECT
  # CDN 与 Google 中国（省流量）：jsDelivr 有中国节点，直连更快且不耗节点流量；
  # google.cn 是 Google 在中国的可直连域名，必须放在 google.com 代理规则之前
  - DOMAIN-SUFFIX,cdn.jsdelivr.net,DIRECT
  - DOMAIN-SUFFIX,google.cn,DIRECT
  # 局域网与保留地址
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - RULE-SET,lancidr,DIRECT
  # 广告拦截
  - RULE-SET,reject,REJECT
  # AI 服务（在所有中国规则之上，避免被直连规则截走）
  # MetaCubeX MRS 规则集（官方域名清单）+ 手工补齐
  - RULE-SET,openai,🤖 AI
  - RULE-SET,anthropic,🤖 AI
  - RULE-SET,gemini,💎 Gemini
  # OpenAI / ChatGPT
  - DOMAIN-SUFFIX,openai.com,🤖 AI
  - DOMAIN-SUFFIX,chatgpt.com,🤖 AI
  - DOMAIN-SUFFIX,chat.com,🤖 AI
  - DOMAIN-SUFFIX,sora.com,🤖 AI
  - DOMAIN-SUFFIX,oaistatic.com,🤖 AI
  - DOMAIN-SUFFIX,oaiusercontent.com,🤖 AI
  # Anthropic / Claude
  - DOMAIN-SUFFIX,anthropic.com,🤖 AI
  - DOMAIN-SUFFIX,claude.ai,🤖 AI
  - DOMAIN-SUFFIX,claude.com,🤖 AI
  - DOMAIN-SUFFIX,clau.de,🤖 AI
  - DOMAIN-SUFFIX,claudeusercontent.com,🤖 AI
  # Claude 人机验证与登录依赖
  - DOMAIN-SUFFIX,challenges.cloudflare.com,🤖 AI
  # xAI / Grok
  - DOMAIN-SUFFIX,x.ai,🤖 AI
  - DOMAIN-SUFFIX,grok.com,🤖 AI
  - DOMAIN-SUFFIX,grokipedia.com,🤖 AI
  - DOMAIN-SUFFIX,grokusercontent.com,🤖 AI
  # Perplexity
