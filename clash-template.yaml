  - DOMAIN-SUFFIX,max.com,🎬 流媒体
  - DOMAIN-SUFFIX,paramountplus.com,🎬 流媒体
  - DOMAIN-SUFFIX,peacocktv.com,🎬 流媒体
  - DOMAIN-SUFFIX,tv.apple.com,🎬 流媒体
  - DOMAIN-SUFFIX,twitch.tv,🎬 流媒体
