  # 通用代理白名单（Loyalsoldier）：被墙域名 + GFW 列表 + 非 .cn 顶级域
  # tld-not-cn 是兜底安全网：绝大多数境外站用 .com/.net/.org 等非 .cn 后缀，
  # 走到这里即进代理，不会漏到直连
  - RULE-SET,proxy,🚀 节点选择
  - RULE-SET,gfw,🚀 节点选择
  - RULE-SET,tld-not-cn,🚀 节点选择
  # 中国直连（多层叠加，避免漏网）
  - RULE-SET,chinadomain,DIRECT
  - RULE-SET,direct,DIRECT
  - RULE-SET,chinaip,DIRECT
  - RULE-SET,chinacompanyip,DIRECT
  - RULE-SET,cncidr,DIRECT
  # 兜底：黑名单模式。未被任何规则命中的连接一律直连，
  # 中国站永不消耗节点流量；境外站若打不开，把域名加进上方代理白名单即可
  - MATCH,DIRECT
