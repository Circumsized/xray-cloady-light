port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost"
  respect-rules: true
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
  nameserver:
    - https://cloudflare-dns.com/dns-query
proxies:
  - name: "🇺🇸 美国-西雅图-机房"
    type: vless
    server: __DOMAIN__
    port: 443
    uuid: __UUID__
    tls: true
    servername: __DOMAIN__
    network: ws
    ws-opts:
      path: "__WS_PATH__"
proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - "🇺🇸 美国-西雅图-机房"
      - "DIRECT"
  - name: "AI"
    type: select
    proxies:
      - "🇺🇸 美国-西雅图-机房"
      - "DIRECT"
  - name: "STREAM"
    type: select
    proxies:
      - "🇺🇸 美国-西雅图-机房"
      - "DIRECT"
  - name: "GITHUB"
    type: url-test
    url: https://github.com/favicon.ico
    interval: 300
    tolerance: 100
    proxies:
      - "🇺🇸 美国-西雅图-机房"
      - "DIRECT"
rule-providers:
  reject:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/BanAD.list"
    path: ./ruleset/reject.yaml
    interval: 86400
  proxy:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/ProxyLite.list"
    path: ./ruleset/proxy.yaml
    interval: 86400
  direct:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/ChinaDomain.list"
    path: ./ruleset/direct.yaml
    interval: 86400
  media:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/ProxyMedia.list"
    path: ./ruleset/media.yaml
    interval: 86400
rules:
  # DoH 上游：按 DNS 配置分流（Cloudflare 走代理、阿里走直连）
  - DOMAIN,cloudflare-dns.com,PROXY
  - DOMAIN,dns.alidns.com,DIRECT
  # 国内 AI 服务（直连）：deepseek.com / kimi.com 均不在 ACL4SSR ChinaDomain.list 中，
  # 且均为国内可直接访问的服务，走直连可节省节点 10GB/月流量
  - DOMAIN-SUFFIX,deepseek.com,DIRECT
  - DOMAIN-SUFFIX,kimi.com,DIRECT
  # 局域网与保留地址（来源：Loyalsoldier/clash-rules lancidr.txt）
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  # GitHub（已去重：DOMAIN-SUFFIX 已覆盖子域名，见 notes）
  - DOMAIN-SUFFIX,github.com,GITHUB
  - DOMAIN-SUFFIX,githubusercontent.com,GITHUB
  - DOMAIN-SUFFIX,github.io,GITHUB
  - DOMAIN-SUFFIX,githubassets.com,GITHUB
  # AI 服务（逐条来源见 rules-v2-notes.md）
